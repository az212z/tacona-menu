<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{background:#0d0b0a;display:grid;place-items:center;min-height:100vh;font-family:"IBM Plex Sans Arabic",sans-serif}
.card{width:760px;height:1075px;position:relative;overflow:hidden;border-radius:34px;
  background:radial-gradient(120% 80% at 50% 0%,#241a14 0%,#141210 55%,#0f0d0b 100%);
  color:#F6F3ED;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:54px 56px 46px;box-shadow:0 40px 120px rgba(0,0,0,.6)}
.glow{position:absolute;inset-block-start:-18%;inset-inline-start:50%;transform:translateX(-50%);width:70%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(200,154,91,.28),transparent 62%);filter:blur(4px);pointer-events:none}
.papel{display:flex;gap:0;justify-content:center;margin-block-end:30px;z-index:1}
.papel i{width:34px;height:44px;clip-path:polygon(0 0,100% 0,50% 100%);opacity:.95}
.brand{font-family:"Alexandria";font-weight:900;font-size:74px;letter-spacing:.06em;z-index:1;line-height:1;
  background:linear-gradient(120deg,#E8C88C,#C89A5B);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .t{font-size:.7em}
.eyebrow{font-family:"Alexandria";font-weight:600;letter-spacing:.32em;font-size:15px;color:#F4CDA5;margin-block:14px 0;text-transform:uppercase;z-index:1}
.head{font-family:"Alexandria";font-weight:800;font-size:52px;margin-block:26px 4px;z-index:1;line-height:1.2}
.head b{color:#E0703F}
.sub{color:rgba(246,243,237,.72);font-size:19px;margin-block-end:26px;z-index:1;max-width:24ch;line-height:1.7}
.qrbox{background:#fff;border-radius:26px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.4);z-index:1}
.qrbox img{width:360px;height:360px;display:block;image-rendering:pixelated}
.scan{display:inline-flex;align-items:center;gap:10px;margin-block:26px 0;font-weight:700;font-size:22px;z-index:1}
.scan svg{width:26px;height:26px;stroke:#E0703F;fill:none;stroke-width:2}
.url{margin-block-start:auto;z-index:1;font-family:"Alexandria";letter-spacing:.02em;direction:ltr;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:999px;
  padding:12px 26px;font-size:18px;color:#EBE5D9;font-weight:600}
.foot{color:rgba(246,243,237,.5);font-size:15px;margin-block-start:16px;z-index:1}
.bar{position:absolute;inset-block-end:0;inset-inline:0;height:12px;background:linear-gradient(to left,#B93227,#E0703F,#C89A5B)}
</style></head><body>
