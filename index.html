<style>
/* ============================================================
   TACONA MENU v2 · premium QR menu + cart
   Bone / ink / chili editorial. RTL logical properties only.

   ============================================================ */
:root{
  --bone:#F6F3ED; --paper:#FDFBF7; --sand:#EBE5D9; --sand-2:#DED6C6;
  --ink:#141210; --ink-2:#3B352F; --muted:#7C7469;
  --chili:#B93227; --chili-deep:#93251C; --gold:#C89A5B;
  --ok:#2E6B4E; --ok-bg:#EAF2ED; --warn-bg:#F6EFE0;
  --line:rgba(20,18,16,.12); --line-soft:rgba(20,18,16,.07);
  --ar:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --dp:'Alexandria','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --shell:1180px; --pad:clamp(16px,4.5vw,44px);
  --r-m:16px; --r-l:22px;
  --sh-s:0 1px 2px rgba(20,18,16,.05),0 4px 14px rgba(20,18,16,.06);
  --sh-m:0 2px 6px rgba(20,18,16,.06),0 18px 44px rgba(20,18,16,.11);
  --ease:cubic-bezier(.22,.68,.32,1);
}
@property --angle{ syntax:'<angle>'; inherits:false; initial-value:0deg; }
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-block-start:120px}
body{
  margin:0;background:var(--bone);color:var(--ink);
  font-family:var(--ar);font-size:clamp(15px,1.02vw,16.5px);
  line-height:1.85;letter-spacing:normal;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"]{letter-spacing:0 !important}
img{max-width:100%;display:block}
a{color:inherit}
button{font-family:var(--ar);letter-spacing:0}
.en{font-family:var(--dp);letter-spacing:.14em;text-transform:uppercase}
.num{font-family:var(--dp);letter-spacing:0}

/* ---------- Scroll progress ---------- */
#prog{
  position:fixed;inset-block-start:0;inset-inline:0;height:3px;z-index:80;
  background:linear-gradient(to left,var(--chili),#E0703F);
  transform-origin:100% 50%;transform:scaleX(0);pointer-events:none;
}
@supports (animation-timeline: scroll()){
  @media (prefers-reduced-motion: no-preference){
    #prog{animation:grow linear both;animation-timeline:scroll(root)}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  }
}

/* ---------- Hero ---------- */
.hero{
  position:relative;min-height:min(62svh,560px);display:grid;place-items:end center;
  color:#fff;isolation:isolate;overflow:hidden;background:var(--ink);
}
.hero-media{position:absolute;inset:0;z-index:-3}
.hero-media img{width:100%;height:100%;object-fit:cover;transform-origin:center}
.hero-glow{
  position:absolute;z-index:-2;inset-block-start:-20%;inset-inline-start:-10%;
  width:65%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(200,154,91,.32),transparent 62%);

}
.hero::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,rgba(12,10,9,.9) 0%,rgba(12,10,9,.38) 46%,rgba(12,10,9,.28) 100%);
}
.grain{
  position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;

.hero-in{position:relative;z-index:1;width:min(var(--shell),100%);padding:var(--pad);padding-block-end:clamp(28px,6vh,64px);text-align:center}

@keyframes rise{to{transform:none}}

/* ---------- Sticky category nav ---------- */

  font-weight:600;font-size:.86rem;border-radius:999px;
  padding:.5em 1.15em;cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:background .25s,color .25s,border-color .25s;
}
.chip.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}

/* ---------- Sections ---------- */
.shell{width:min(var(--shell),100%);margin-inline:auto;padding-inline:var(--pad)}
.msec{padding-block:clamp(30px,5.5vh,58px)}
.msec + .msec{border-block-start:1px solid var(--line-soft)}
.msec-head{display:flex;align-items:baseline;gap:14px;margin-block-end:clamp(16px,3vh,26px)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:clamp(14px,2vw,22px)}

/* ---------- Cards ---------- */
.card{
  background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r-l);
  overflow:hidden;box-shadow:var(--sh-s);display:flex;flex-direction:column;

}
.card::after{
  content:"";position:absolute;inset-block-start:0;inset-inline:0;height:3px;

}
.card-img{aspect-ratio:4/3;overflow:hidden;background:var(--sand)}

.card-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}

}
.badge.sig::before{
  content:"";position:absolute;inset:-40%;z-index:-1;
  background:conic-gradient(from var(--angle),var(--chili) 0%,var(--gold) 25%,var(--chili) 50%,var(--gold) 75%,var(--chili) 100%);
}
@media (prefers-reduced-motion: no-preference){
  .badge.sig::before{animation:spin 5s linear infinite}

}

/* ---------- Qty control ---------- */
.addrow{margin-block-start:10px;min-height:44px;display:flex}
.add{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:.5em;

}

.bar{

}

<body>
<div id="prog" aria-hidden="true"></div>

<!-- ======== HERO ======== -->
<header class="hero" id="top">
  <div class="hero-media"><img src="assets/img/hero.jpg" alt="أطباق تاكونا المكسيكية" fetchpriority="high" /></div>
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="hero-in">

<script>
/* ============================================================

   photo:null renders a typographic tile until the photo arrives.

const WA = "966532555012";
const MENU = [
  { id:"mains", name:"الأصناف الرئيسية", items:[

    { n:"تاكو الروبيان", d:"وجبة قطعتين محشوة بخليط الروبيان الشهي مع سلطة كولسلو وصوص الديناميت الحار وليمون، تُقدَّم مع بطاطس مقلية.", p:26, cal:730, photo:"taco-shrimp.jpg" },
    { n:"تاكو الدجاج المشوي", d:"قطعتان من خبز التورتيلا محشوتان بصدور دجاج مشوي، تُقدَّم مع بيكو دي جايو وصلصة الكزبرة وصلصة روخا وليمون، بالإضافة للبطاطس.", p:24, cal:762, photo:"taco-grilled-real.jpg" },
  ]},
  { id:"boxes", name:"الجمعات", items:[
    { n:"فيستا بوكس", d:"وجبة بيريا تاكونا مع بوكس 4 قطع من اختيارك بين الدجاج والروبيان، بالإضافة لبطاطس البيريا المكسيكية مع مشروب 1 لتر.", p:90, cal:2800, photo:"fiesta-box.jpg", tag:"الأكثر طلبًا" },
    { n:"بوكس 4 تاكو", d:"أربعة أنواع من التاكو من اختيارك، يُستثنى اللحم.", p:40, cal:800, photo:"box-4.jpg", opts:["ديناميت","رانش","شيدر","تاكينا","جواكمولي"] },
    { n:"بوكس 3 تاكو", d:"ثلاثة أنواع من التاكو من اختيارك، يُستثنى اللحم.", p:30, cal:600, photo:null, opts:["ديناميت","رانش","شيدر","تاكينا","جواكمولي"] },
  ]},
  { id:"burrito", name:"البوريتو", items:[
    { n:"بوريتو الدجاج المشوي", d:"تورتيلا دقيق محشوة بأرز الكزبرة والليمون وفاصوليا سوداء ودجاج مشوي، تُقدَّم مع كريمة حامضة وصلصة روخا وصوص رانش تشيبوتلي وخضار مشوية.", p:25, cal:780, photo:null },
    { n:"بوريتو اللحم المشوي", d:"تورتيلا دقيق محشوة بأرز الكزبرة والليمون وفاصوليا سوداء ولحم مشوي، تُقدَّم مع كريمة حامضة وصلصة روخا وصوص رانش تشيبوتلي وخضار مشوية.", p:28, cal:670, photo:"burrito-beef.jpg" },
    { n:"البوريتو بول باللحم", d:"صحن لحم بقري مشوي متبّل مع أرز بالكزبرة وفاصوليا سوداء وصلصات تاكونا المميزة، مغطى بالكريمة الحامضة والجواكامولي مع ذرة وصلصة رانش تشيبوتلي وخضار مشوية بنكهة مدخّنة.", p:28, cal:720, protein:40, photo:"bowl-beef.jpg" },
    { n:"البوريتو بول بالدجاج المشوي", d:"صحن دجاج مشوي متبّل مع أرز بالكزبرة وفاصوليا سوداء وصلصات تاكونا المميزة، مغطى بالكريمة الحامضة والجواكامولي مع ذرة وصلصة رانش تشيبوتلي وخضار مشوية بنكهة مدخّنة.", p:26, cal:780, protein:48, photo:"bowl-chicken.jpg" },
  ]},
  { id:"sides", name:"الأطباق الجانبية", items:[
    { n:"بطاطس البيريا المكسيكية", d:"بطاطس مقرمشة مغطاة بقطع لحم البريسكت المدخّن المطهو ببطء، والجواكامولي المكسيكي، وصوص تشيبوتلي كريمي يضيف نكهة مدخّنة.", p:18, cal:680, photo:null },
    { n:"السلطة المكسيكية", d:"مزيج طازج من الخس المقرمش والذرة الحلوة وبيكو دي جايو، مع الفاصوليا السوداء والأفوكادو الكريمي ومكعبات جبنة الحلوم المشوية ورقائق التورتيلا، تُقدَّم مع صلصة الكزبرة المميزة.", p:24, cal:460, photo:"salad.jpg" },
    { n:"بطاطس مقلية", d:"بطاطس ذهبية مقرمشة.", p:7, cal:null, photo:null },
  ]},
  { id:"sauces", name:"الصوصات والسلطات", items:[
    { n:"سلطة المانجو", d:"", p:5, cal:null, photo:null },
    { n:"سلطة الأفوكادو", d:"", p:5, cal:null, photo:null },
    { n:"سلطة كولسلو", d:"", p:5, cal:null, photo:null },
  ]},
  { id:"drinks", name:"المشروبات", items:[
    { n:"بيبسي", d:"", p:3, cal:null, photo:"pepsi.jpg" },
    { n:"بيبسي دايت", d:"", p:3, cal:null, photo:"pepsi-diet.jpg" },
    { n:"سفن أب", d:"", p:3, cal:null, photo:"7up.jpg" },
    { n:"حمضيات", d:"", p:3, cal:null, photo:"citrus.jpg" },
    { n:"ماء", d:"", p:1, cal:null, photo:"water.jpg" },
  ]},
];

try{
/* ---------- render ---------- */
const chips = document.getElementById('chips');
const main = document.getElementById('menu');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ITEMS = {};   // key -> item

MENU.forEach(sec => {
  chips.insertAdjacentHTML('beforeend',
    `<a class="chip" href="#${sec.id}" data-sec="${sec.id}">${esc(sec.name)}</a>`);
  const cards = sec.items.map(it => {
    const key = it.n;
    ITEMS[key] = it;
    const img = it.photo
      ? `<div class="card-img"><img src="assets/img/${it.photo}" alt="${esc(it.n)}" loading="lazy" decoding="async" /></div>`
      : `<div class="tile" aria-hidden="true"><span>${esc(it.n.slice(0,2))}</span></div>`;
    return `<article class="card rv" data-key="${esc(key)}">
      ${it.tag?`<span class="badge${it.tag==='التوقيع'?' sig':''}">${esc(it.tag)}</span>`:''}
      ${img}
      <div class="card-body">
        <div class="card-top">
          <h3>${esc(it.n)}</h3>
          <span class="price"><span class="num">${it.p}</span><small>ر.س</small></span>
        </div>
        ${it.d?`<p>${esc(it.d)}</p>`:''}
        <div class="meta">
          ${it.cal?`<span class="kcal"><span class="num" dir="ltr">${it.cal}</span> سعرة</span>`:''}
          ${it.protein?`<span class="prot">${it.protein} جم بروتين</span>`:''}
          ${(it.opts||[]).map(o=>`<span class="opt">${esc(o)}</span>`).join('')}
        </div>
        <div class="addrow">
          <button class="add" data-add="${esc(key)}">أضف للطلب</button>
          <div class="qty">
            <button data-minus="${esc(key)}" aria-label="أنقص">−</button>
            <span class="q num" data-q="${esc(key)}">1</span>
            <button data-plus="${esc(key)}" aria-label="زد">+</button>
          </div>
        </div>
      </div>
    </article>`;
  }).join('');
  main.insertAdjacentHTML('beforeend',
    `<section class="msec" id="${sec.id}">
      <div class="msec-head rv"><h2>${esc(sec.name)}</h2><span class="count num" dir="ltr">${sec.items.length}</span></div>
      <div class="grid">${cards}</div>
    </section>`);
});

/* ---------- cart ---------- */
const CART_KEY = 'tacona_cart_v1';
let cart = {};
try{ cart = JSON.parse(localStorage.getItem(CART_KEY) || '{}') || {}; }catch(e){ cart = {}; }
Object.keys(cart).forEach(k => { if(!ITEMS[k]) delete cart[k]; });

const cartbtn = document.getElementById('cartbtn');
const cartCount = document.getElementById('cartCount');
const cartTotal = document.getElementById('cartTotal');
const drawer = document.getElementById('drawer');
const drawerList = document.getElementById('drawerList');
const drawerTotal = document.getElementById('drawerTotal');
const sendOrder = document.getElementById('sendOrder');

const money = v => `${v} SR`;
const totals = () => {
  let count = 0, total = 0;
  for(const k in cart){ count += cart[k]; total += cart[k] * ITEMS[k].p; }
  return { count, total };
};

function save(){ try{ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }catch(e){} }

function syncCards(){
  document.querySelectorAll('.card[data-key]').forEach(card => {
    const k = card.dataset.key, q = cart[k] || 0;
    card.classList.toggle('inCart', q > 0);
    const qEl = card.querySelector(`[data-q]`);
    if (qEl) qEl.textContent = q || 1;
  });
}

function syncBar(){
  const { count, total } = totals();
  cartCount.textContent = count;
  cartTotal.textContent = money(total);
  cartbtn.disabled = count === 0;
}

function syncDrawer(){
  const { total } = totals();
  drawerTotal.textContent = money(total);
  const keys = Object.keys(cart);
  if (!keys.length){
    drawerList.innerHTML = '<p class="d-empty">سلتك فارغة. أضف أصنافك من المنيو.</p>';
  } else {
    drawerList.innerHTML = keys.map(k => {
      const it = ITEMS[k], q = cart[k];
      return `<div class="d-item">
        <div class="d-info"><b>${esc(k)}</b><span>${it.p} SR</span></div>
        <div class="d-qty">
          <button data-minus="${esc(k)}" aria-label="أنقص">−</button>
          <span class="q">${q}</span>
          <button data-plus="${esc(k)}" aria-label="زد">+</button>
        </div>
        <span class="d-line">${it.p * q} SR</span>
      </div>`;
    }).join('');
  }
  // WhatsApp message
  const lines = keys.map(k => `${k} ×${cart[k]} = ${ITEMS[k].p * cart[k]} ريال`);
  const msg = `مرحبا، أبي أطلب من منيو تاكونا:\n${lines.join('\n')}\nالمجموع: ${total} ريال`;
  sendOrder.href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}

function sync(){ syncCards(); syncBar(); syncDrawer(); save(); }

function change(k, delta){
  cart[k] = (cart[k] || 0) + delta;
  if (cart[k] <= 0) delete cart[k];
  sync();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-plus],[data-minus]');
  if (!t) return;
  if (t.dataset.add)   change(t.dataset.add, +1);
  if (t.dataset.plus)  change(t.dataset.plus, +1);
  if (t.dataset.minus) change(t.dataset.minus, -1);
});

const openCart = v => document.body.classList.toggle('cartOpen', v);
cartbtn.addEventListener('click', () => openCart(true));
document.getElementById('drawerClose').addEventListener('click', () => openCart(false));
document.getElementById('scrim').addEventListener('click', () => openCart(false));
document.getElementById('clearCart').addEventListener('click', () => { cart = {}; sync(); });
sendOrder.addEventListener('click', () => { if (!Object.keys(cart).length) { openCart(false); return false; } });

sync();

/* ---------- motion & nav ---------- */
document.documentElement.classList.add('loaded');
document.body.classList.add('loaded');

if (!CSS.supports('animation-timeline: view()')) {
  const io = new IntersectionObserver(es => es.forEach(en => {
    if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); }
  }), { threshold:.1, rootMargin:'-6% 0px' });
  document.querySelectorAll('.rv').forEach(el => io.observe(el));
  setTimeout(() => document.querySelectorAll('.rv:not(.in)').forEach(el => el.classList.add('in')), 2600);
}

// smooth anchor scroll for chips (no CSS scroll-behavior: keeps native scroll snappy)
chips.addEventListener('click', e => {
  const a = e.target.closest('a.chip'); if (!a) return;
  e.preventDefault();
  const sec = document.getElementById(a.dataset.sec);
  if (sec) {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const y = sec.getBoundingClientRect().top + window.scrollY - 70;
    window.scrollTo({ top: y, behavior: reduce ? 'instant' : 'smooth' });
  }
});

// sticky nav shadow + scroll-spy (moves ONLY the chip strip, never the page)
const nav = document.getElementById('catnav');
const navIn = document.querySelector('.catnav-in');
const chipEls = [...document.querySelectorAll('.chip')];
const spy = new IntersectionObserver(es => {
  es.forEach(en => {
    if (!en.isIntersecting) return;
    chipEls.forEach(c => c.classList.toggle('on', c.dataset.sec === en.target.id));
    const on = chipEls.find(c => c.classList.contains('on'));
    if (on) {
      // center the active chip by scrolling the strip itself (RTL-safe, no page scroll)
      const target = on.offsetLeft - (navIn.clientWidth - on.offsetWidth) / 2;
      navIn.scrollTo({ left: target, behavior: 'smooth' });
    }
  });
}, { rootMargin:'-30% 0px -60% 0px' });
MENU.forEach(s => { const el = document.getElementById(s.id); if (el) spy.observe(el); });
addEventListener('scroll', () => nav.classList.toggle('stuck', scrollY > 8), { passive:true });

// progress-bar fallback
if (!CSS.supports('animation-timeline: scroll()')) {
  const prog = document.getElementById('prog');
  let ticking = false;
  addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const h = document.documentElement;
      prog.style.transform = `scaleX(${h.scrollTop / (h.scrollHeight - h.clientHeight || 1)})`;
      ticking = false;
    });
  }, { passive:true });
}
} catch(e) {
  console.error(e);
  document.querySelectorAll('.rv').forEach(el => el.classList.add('in'));
}
</script>
